image boot.vfat {
  vfat {
    files = {
      "bcm2712-rpi-5-b.dtb",
      "bcm2712d0-rpi-5-b.dtb",
      "rpi-firmware/cmdline.txt",
      "rpi-firmware/config.txt",
      "rpi-firmware/overlays",
      "Image",
      "u-boot.bin",
      "boot.scr",
      "uboot-env.bin",
      "wpa_supplicant-wlan0.conf"
    }
  }
  size = 64M
}

image data.ext4 {
  ext4 {
    label = "data"
  }
  size = 512M
}

image sdcard.img {
  hdimage {}

  partition boot {
    partition-type = 0xC
    bootable = "true"
    image = "boot.vfat"
  }

  partition rootfs_A {
    partition-type = 0x83
    image = "rootfs.ext4"
  }

  partition rootfs_B {
    partition-type = 0x83
    image = "rootfs.ext4"
  }

  partition data {
    partition-type = 0x83
    image = "data.ext4"
  }
}